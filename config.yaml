# ============================================================
# RAG Juridique Souverain — Configuration Globale
# ============================================================
# Ce fichier centralise tous les paramètres du système.
# Modifier ce fichier pour adapter le comportement du pipeline.

# --- Chemins des données ---
paths:
  raw_data: "data/raw"                    # Documents juridiques bruts (PDF)
  processed_data: "data/processed"        # Corpus nettoyé et découpé (JSON)
  vector_store: "data/vector_store"       # Index FAISS + métadonnées
  qa_eval: "data/qa_eval"                 # Jeu de questions-réponses d'évaluation
  logs: "logs"                            # Journaux d'exécution

# --- Modèle d'embeddings ---
embeddings:
  model_name: "intfloat/multilingual-e5-base"   # Modèle multilingue open-source
  dimension: 768                                 # Dimension des vecteurs
  batch_size: 32                                 # Taille des batchs pour l'encodage
  normalize: true                                # Normaliser les vecteurs (cosine similarity)
  device: "cpu"                                  # "cpu" ou "cuda" si GPU disponible

# --- Découpage (Chunking) ---
chunking:
  strategy: "article"              # Stratégie : "article", "fixed_size", "sentence"
  chunk_size: 500                  # Taille cible en tokens
  chunk_overlap: 50                # Chevauchement entre chunks (en tokens)
  min_chunk_size: 100              # Taille minimale d'un chunk
  separators:                      # Séparateurs pour le découpage
    - "\nArticle "
    - "\nChapitre "
    - "\nSection "
    - "\nTitre "
    - "\n\n"
    - "\n"

# --- Recherche (Retrieval) ---
retrieval:
  top_k: 5                         # Nombre de chunks retournés
  similarity_threshold: 0.3        # Seuil minimal de similarité cosinus
  search_type: "similarity"        # "similarity" ou "mmr" (Maximal Marginal Relevance)
  mmr_lambda: 0.5                  # Paramètre lambda pour MMR (diversité vs pertinence)

# --- Génération (LLM) ---
generation:
  provider: "ollama"               # "ollama" ou "huggingface"
  model_name: "mistral"            # Nom du modèle dans Ollama
  temperature: 0.1                 # Température (basse = plus déterministe)
  max_tokens: 1024                 # Longueur maximale de la réponse
  top_p: 0.9                       # Nucleus sampling
  abstention_threshold: 0.25       # Seuil en-dessous duquel le système s'abstient
  system_prompt: |
    Tu es un assistant juridique spécialisé dans le droit marocain.
    Tu réponds aux questions des citoyens en te basant UNIQUEMENT sur les extraits
    de textes juridiques qui te sont fournis comme contexte.

    Règles strictes :
    1. Réponds UNIQUEMENT à partir du contexte fourni.
    2. Cite TOUJOURS la source exacte (loi, article, code).
    3. Si le contexte ne contient pas l'information, dis clairement :
       "Je ne dispose pas de cette information dans les textes consultés."
    4. Formule ta réponse de manière claire et accessible au citoyen.
    5. Ajoute un avertissement : "Réponse fournie à titre informatif ;
       pour une situation particulière, consultez un professionnel."

# --- Interface Streamlit ---
ui:
  title: "⚖️ Assistant Juridique Souverain"
  subtitle: "Posez votre question sur le droit marocain"
  page_icon: "⚖️"
  max_history: 10                  # Nombre max de messages dans l'historique

# --- Évaluation ---
evaluation:
  metrics:
    - "precision_at_k"
    - "recall_at_k"
    - "mrr"
    - "rouge_l"
    - "faithfulness"
    - "abstention_accuracy"
  k_values: [1, 3, 5]             # Valeurs de K pour Precision@K et Recall@K

# --- Logging ---
logging:
  level: "INFO"                    # Niveau de log : DEBUG, INFO, WARNING, ERROR
  format: "{time:YYYY-MM-DD HH:mm:ss} | {level:<8} | {name}:{function}:{line} - {message}"
  rotation: "10 MB"                # Rotation des fichiers de log
  retention: "30 days"             # Rétention des logs
